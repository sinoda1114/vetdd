# vetdd 固有の CI（標準 CI の ci.yml に加えて）: macOS の bash 3.2 で bats、fixture の vitest と audit。
name: vetdd extra

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: extra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats-bash32:
    # The scripts must run on the bash 3.2 macOS ships; the standard CI runs bats on Linux's bash 5.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Put /bin/bash (3.2) first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Check the bash version
        run: |
          v="$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')"
          echo "bash $v"
          [ "$v" = 3.2 ]
          command -v jq perl git node
      - name: bats
        run: npm test

  fixture:
    # fixtures/ts-kata is the practice target the dogfood runs use: it must install, test, and audit clean.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fixtures/ts-kata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fixtures/ts-kata/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: vitest
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Audit
        run: npm audit --audit-level=high
